runtime:
  environment: development

server:
  port: 8080

database:
  host: localhost
  port: 3307
  user: root
  password: 123456
  dbname: feedsystem

redis:
  host: localhost
  port: 6379
  password: 123456
  db: 0

rabbitmq:
  host: localhost
  port: 5672
  username: admin
  password: password123

observability:
  pprof:
    enabled: true
    api_addr: localhost:6060
    worker_addr: localhost:6061

content:
  max_images: 9
  max_image_size_bytes: 10485760
  max_body_length: 10000

commerce:
  order_payment_valid_for: 30m
  flash_sale_payment_valid_for: 10m

popularity:
  like_weight: 1
  favorite_weight: 2
  comment_weight: 3
  shop_visit_weight: 1.5
  product_click_weight: 2
  paid_order_weight: 8
  paid_order_contribution_cap: 24
  decay_half_life: 24h

mock_payment:
  routes_enabled: true
  callback_secret: mock-payment-local-secret

search:
  provider: mysql
  elasticsearch:
    addresses: []
    username: ""
    password: ""
    index_prefix: feedsystem
    request_timeout: 2s
